---
layout: default
---
<main class="shell docpage">
  <div class="eyebrow"><span class="h">docs</span> {{ page.eyebrow | default: page.title | downcase }}</div>
  <h1>{{ page.title }}</h1>
  {%- if page.summary %}
  <p class="lede">{{ page.summary }}</p>
  {%- endif %}
  {%- if page.source %}
  <p class="sourceline">source: <a href="{{ site.repo }}/blob/main/docs/{{ page.source }}"><code>docs/{{ page.source }}</code></a></p>
  {%- endif %}

  <article class="prose">
    {{ content }}
  </article>
</main>
